<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>OTP Vault</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div id="app">
    <header class="header" style="display:flex;justify-content:space-between;align-items:center;gap:8px; padding-right:16px;">
      <div style="display:flex;align-items:center;gap:8px;">
        <img src="../icons/icon.svg" alt="OTP Vault" width="28" height="28"/>
        <h1 style="margin:0;font-size:18px;">OTP Vault</h1>
      </div>
      <button id="new-auth" class="primary" title="Add authenticator" style="padding:6px 10px; font-size:14px; border-radius:6px;">+</button>
    </header>

    <section id="onboarding-section" class="panel" style="display:none;">
      <h2>Getting started</h2>
      <p>Click the + button to add your first authenticator. This onboarding helps you set up your first token quickly.</p>
    </section>

    <section id="add-section" class="panel" style="display:none;">
      <h2>Add authenticator</h2>
      <div class="tabs" id="import-tabs">
        <button class="tab-btn active" data-tab="qr">QR (webcam)</button>
        <button class="tab-btn" data-tab="upload">Upload image</button>
        <button class="tab-btn" data-tab="link">Link</button>
      </div>

      <div id="tab-qr" class="tab-content active">
        <div class="qr-controls">
          <video id="video" width="320" height="240" autoplay muted playsinline></video>
          <div class="scan-actions">
            <button id="start-scan">Start scanning QR</button>
            <button id="stop-scan" disabled>Stop</button>
          </div>
        </div>
        <div id="qr-feedback" class="feedback"></div>
      </div>

      <div id="tab-upload" class="tab-content">
        <input type="file" id="image-input" accept="image/*" />
        <img id="image-preview" class="preview" src="" alt="Preview" hidden />
        <div id="upload-feedback" class="feedback"></div>
      </div>

      <div id="tab-link" class="tab-content">
        <input type="text" id="otp-url" placeholder="otpauth://totp/Issuer:Account?secret=BASE32…" />
        <button id="import-url-btn" class="primary">Import</button>
        <div id="link-feedback" class="feedback"></div>
      </div>
    </section>

    <section id="list-section" class="panel">
      <h2>Authenticators</h2>
      <div id="auth-list" class="list"></div>
    </section>
  </div>
  <script src="qrcode.js"></script>
  <script src="popup.js"></script>
</body>
</html>
